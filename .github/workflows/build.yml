name: Build JoyMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JoyMusic FOSS Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JoyMusic source ZIP
        run: |
          mkdir -p joymusic
          unzip -q JoyMusic_Android_Native_Source.zip -d joymusic

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Create debug signing key for sideload testing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build signed JoyMusic APK
        working-directory: joymusic
        env:
          METROLIST_APPLICATION_ID: com.joymusic.app
          METROLIST_APP_NAME: JoyMusic
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleFossRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMusic-APK
          path: joymusic/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
